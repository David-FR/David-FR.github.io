bio: |
  David Fernandez is a PhD candidate in Computer Science at Clemson
  University and an AI Researcher at BMW Group. His research focuses on
  safe, efficient, and explainable AI, spanning large language models,
  vision-language models, agentic systems, and adversarial robustness.
  His 10 papers include five first-authored studies on component-level
  explainability, zero-shot reasoning, and adversarial scenario analysis.

  At BMW Group, he develops enterprise AI agents, automated prompt
  optimization, and defenses against multi-turn adversarial attacks.
  His work also includes edge AI for industrial agentic systems.

  Through Clemson’s Virtual Prototyping of Ground Systems (VIPR-GS)
  program, he develops explainable reasoning and multimodal evaluation
  systems for the U.S. Army’s Next Generation Combat Vehicle program.

