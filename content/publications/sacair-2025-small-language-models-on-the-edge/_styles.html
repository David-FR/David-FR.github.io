<style>
/* ── Scroll-reveal: shared across intro / benchmark / planning / results ──
   Hiding is gated behind .slm-js (set below only when IntersectionObserver
   exists), so content stays visible without JS and under reduced motion. */
@keyframes slm-up {
  from { opacity: 0; transform: translateY(18px) }
  to   { opacity: 1; transform: none }
}
@keyframes slm-grow { to { transform: scaleX(1) } }
@media screen and (prefers-reduced-motion: no-preference) {
  .slm-js .slm-reveal { opacity: 0 }
  .slm-js .slm-reveal.slm-visible { animation: slm-up .55s ease forwards }
  .slm-js .slm-reveal.slm-d1.slm-visible { animation-delay: .1s }
  .slm-js .slm-reveal.slm-d2.slm-visible { animation-delay: .25s }
  .slm-js .slm-reveal.slm-d3.slm-visible { animation-delay: .4s }

  /* bars grow from zero when their own section scrolls into view */
  .slm-js .slm-bar { transform: scaleX(0); transform-origin: left center }
  .slm-js .slm-visible .slm-bar { animation: slm-grow 1s cubic-bezier(.22,1,.36,1) forwards }
}

/* ── Deliberately wide figures remain usable on touch and keyboard ── */
.slm-scroll {
  overscroll-behavior-inline: contain;
  scrollbar-color: rgba(129,140,248,.45) rgba(15,23,42,.45);
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}
.slm-scroll:focus-visible {
  outline: 2px solid rgba(129,140,248,.75);
  outline-offset: 3px;
}
.slm-scroll::-webkit-scrollbar { height: 6px }
.slm-scroll::-webkit-scrollbar-track {
  background: rgba(15,23,42,.45);
  border-radius: 999px;
}
.slm-scroll::-webkit-scrollbar-thumb {
  background: rgba(129,140,248,.45);
  border-radius: 999px;
}
</style>
<script>if("IntersectionObserver" in window)document.documentElement.classList.add("slm-js")</script>
