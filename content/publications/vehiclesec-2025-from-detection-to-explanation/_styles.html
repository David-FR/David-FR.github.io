<style>
/* ── Scroll-reveal: shared across problem / framework / results ──
   Hiding is gated behind .dx-js (set below only when IntersectionObserver
   exists), so content stays visible without JS and under reduced motion. */
@keyframes dx-up {
  from { opacity: 0; transform: translateY(18px) }
  to   { opacity: 1; transform: none }
}
@keyframes dx-grow { to { transform: scaleX(1) } }
@media screen and (prefers-reduced-motion: no-preference) {
  .dx-js .dx-reveal { opacity: 0 }
  .dx-js .dx-reveal.dx-visible { animation: dx-up .55s ease forwards }
  .dx-js .dx-reveal.dx-d1.dx-visible { animation-delay: .1s }
  .dx-js .dx-reveal.dx-d2.dx-visible { animation-delay: .25s }
  .dx-js .dx-reveal.dx-d3.dx-visible { animation-delay: .4s }

  /* bars grow from zero when their own section scrolls into view */
  .dx-js .dx-bar { transform: scaleX(0); transform-origin: left center }
  .dx-js .dx-visible .dx-bar { animation: dx-grow 1s cubic-bezier(.22,1,.36,1) forwards }
}
</style>
<script>if("IntersectionObserver" in window)document.documentElement.classList.add("dx-js")</script>
