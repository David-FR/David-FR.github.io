<style>
/* ── Scroll-reveal: shared across problem / framework / results ──
   Hiding is gated behind .mc-js (set below only when IntersectionObserver
   exists), so content stays visible without JS and under reduced motion. */
@keyframes mc-up {
  from { opacity: 0; transform: translateY(18px) }
  to   { opacity: 1; transform: none }
}
@keyframes mc-grow { to { transform: scaleX(1) } }
@keyframes mc-pulse {
  0%,100% { opacity: .35; transform: scale(1) }
  50%     { opacity: 1;   transform: scale(1.08) }
}
@media screen and (prefers-reduced-motion: no-preference) {
  .mc-js .mc-reveal { opacity: 0 }
  .mc-js .mc-reveal.mc-visible { animation: mc-up .55s ease forwards }
  .mc-js .mc-reveal.mc-d1.mc-visible { animation-delay: .1s }
  .mc-js .mc-reveal.mc-d2.mc-visible { animation-delay: .25s }
  .mc-js .mc-reveal.mc-d3.mc-visible { animation-delay: .4s }

  /* bars grow from zero when their own section scrolls into view */
  .mc-js .mc-bar { transform: scaleX(0); transform-origin: left center }
  .mc-js .mc-visible .mc-bar { animation: mc-grow 1s cubic-bezier(.22,1,.36,1) forwards }

  .mc-dsl-pulse { animation: mc-pulse 2.2s ease-in-out infinite }
}
@media screen and (prefers-reduced-motion: reduce) {
  .mc-dsl-pulse { animation: none; opacity: .8 }
}

/* ── Amber signal flowing from MIRAGE through DSL into CLEAR (overview figure).
   Shown only where motion paths are supported; otherwise hidden entirely. ── */
@keyframes mc-flow {
  0%   { offset-distance: 0%;   opacity: 0 }
  12%  { opacity: 1 }
  88%  { opacity: 1 }
  100% { offset-distance: 100%; opacity: 0 }
}
.mc-flow-dot { display: none }
@supports (offset-path: path('M 0 0 L 1 1')) {
  @media screen and (prefers-reduced-motion: no-preference) {
    .mc-flow-dot { display: block; animation: mc-flow 3.2s ease-in-out infinite }
  }
}
</style>
<script>if("IntersectionObserver" in window)document.documentElement.classList.add("mc-js")</script>
