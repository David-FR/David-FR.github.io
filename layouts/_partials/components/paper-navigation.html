<style>
  .paper-navigation {
    position: sticky;
    top: calc(var(--navbar-height, 5rem) + .5rem);
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: .25rem 1rem;
    padding: .5rem .75rem;
    border: 1px solid #cbd5e1;
    border-radius: .75rem;
    background: #f8fafc;
    box-shadow: 0 4px 12px rgb(0 0 0 / .08);
  }
  .dark .paper-navigation { background: #161b22; border-color: #374151; }
  .paper-navigation-sections { display: flex; flex-wrap: wrap; gap: .25rem; }
  .paper-navigation a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: .5rem .625rem;
    border-radius: .375rem;
    color: #4338ca;
    font-size: .875rem;
    font-weight: 600;
    text-decoration: none;
  }
  .dark .paper-navigation a { color: #c7d2fe; }
  .paper-navigation a:hover { background: rgb(129 140 248 / .12); }
  .paper-navigation a:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }
  .paper-section-anchor { scroll-margin-top: calc(var(--navbar-height, 5rem) + 6rem); }
  /* Phones: drop the section links and the sticky panel, keep a plain back link. */
  @media (max-width: 48rem) {
    .paper-navigation {
      position: static;
      padding: 0;
      border: 0;
      background: none;
      box-shadow: none;
    }
    .dark .paper-navigation { background: none; }
    .paper-navigation a { padding-left: 0; padding-right: 0; }
    .paper-navigation a:hover { background: none; text-decoration: underline; }
    .paper-navigation-sections { display: none; }
    .paper-section-anchor { scroll-margin-top: calc(var(--navbar-height, 5rem) + 1rem); }
  }
</style>
<nav class="paper-navigation" aria-label="Paper sections">
  {{ with site.GetPage "/publications" }}
    <a href="{{ .RelPermalink }}"><span aria-hidden="true">←&nbsp;</span> Back to publications</a>
  {{ end }}
  <div class="paper-navigation-sections">
    {{ range .Params.paper_navigation }}
      <a href="#{{ .anchor }}">{{ .label }}</a>
    {{ end }}
  </div>
</nav>
